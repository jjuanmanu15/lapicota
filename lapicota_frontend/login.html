<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - La Picota</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: radial-gradient(circle at top left, rgba(56, 189, 248, 0.25), transparent 35%),
                        linear-gradient(135deg, #0b2447 0%, #112d58 50%, #1c3f75 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #f8fafc;
        }

        .login-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 18px;
            box-shadow: 0 20px 60px rgba(10, 25, 47, 0.35);
            width: 100%;
            max-width: 420px;
            padding: 42px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .login-header {
            text-align: center;
            margin-bottom: 36px;
        }

        .login-header h1 {
            color: #0f172a;
            font-weight: 800;
            font-size: 34px;
            margin-bottom: 8px;
        }

        .login-header p {
            color: #475569;
            font-size: 15px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #0d6efd 0%, #2563eb 100%);
            color: white;
            border: none;
            border-radius: 999px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 12px 24px rgba(13, 110, 253, 0.25);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 18px 28px rgba(13, 110, 253, 0.28);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .error-message {
            background-color: #fee2e2;
            color: #991b1b;
            padding: 12px 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: none;
            border: 1px solid #fecaca;
        }

    </style>
</head>

<body>
    <div class="login-container">
        <div class="login-header">
            <h1>La Picota</h1>
            <p>Panel de Control Penitenciario</p>
        </div>

        <div class="error-message" id="errorMessage"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">Usuario</label>
                <input type="text" id="username" name="username" placeholder="Ingrese su usuario" required>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="Ingrese su contraseña" required>
            </div>

            <button type="submit" class="login-btn">Iniciar sesión</button>
        </form>
    </div>

    <script src="js/auth.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', function (e) {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMessage');

            // Validar credenciales
            const users = {
                'admin': { password: '12345', role: 'admin' },
                'valeria': { password: '12345', role: 'user' }
            };

            if (users[username] && users[username].password === password) {
                // Login exitoso
                setAuth(username, users[username].role);
                errorDiv.style.display = 'none';
                window.location.href = 'index.html';
            } else {
                // Login fallido
                errorDiv.textContent = '❌ Usuario o contraseña incorrectos';
                errorDiv.style.display = 'block';
                document.getElementById('password').value = '';
            }
        });
    </script>
</body>

</html>
